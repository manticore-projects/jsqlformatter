import se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask

import java.time.Year

plugins {
    id 'java'
    // Pinned deliberately. This plugin's API has changed shape more than once
    // (publishToMavenCentral(SonatypeHost.S01) -> (CENTRAL_PORTAL) -> no-arg).
    // On "latest.release" an upgrade can silently break the publishing config.
    id "com.vanniktech.maven.publish" version "0.34.0"
    id 'maven-publish'
    id 'signing'

    id 'pmd'
    id 'checkstyle'
    id 'jacoco'
    id 'com.github.kt3k.coveralls' version "latest.release"
    id "com.github.spotbugs" version "latest.release"
    id "com.diffplug.spotless" version "latest.release"
    id "org.owasp.dependencycheck" version "latest.release"
    id "org.sonatype.gradle.plugins.scan" version "latest.release"

    id 'org.hidetake.ssh' version "latest.release"
    id "com.github.hierynomus.license" version "latest.release"
    id "se.bjurr.gitchangelog.git-changelog-gradle-plugin" version "latest.release"
    id 'biz.aQute.bnd.builder' version "latest.release"
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

configurations {
    // Gradle 9: give the configuration a single, explicit role instead of the legacy
    // "consumable AND resolvable AND declarable" default.
    xmlDoclet {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // Pinned, not ranged. Gradle caches dynamic-version resolution for 24h, so an
    // open range resolves differently on a warm desktop and a cold CI runner --
    // which shows up as tests that pass locally and fail on GitHub.
    implementation 'com.manticore-projects.jsqlformatter:jsqlparser:[5.3.336,)'
    implementation 'com.diogonunes:JColor:5.5.1'

    testImplementation platform('org.junit:junit-bom:5.+')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Java Doc in XML Format
    xmlDoclet('com.manticore-projects.tools:xml-doclet:+') { changing = true }
}

// ═══════════════════════════════════════════════════════════════════════════════════════
// Git-derived version
// ═══════════════════════════════════════════════════════════════════════════════════════

// providers.exec is evaluated lazily and is a Configuration-Cache-safe value source.
// Declared once at configuration time so nothing shells out to git during execution.
def gitDescribeProvider = providers.exec {
    commandLine "git", "--no-pager", "-C", projectDir, "describe", "--tags", "--always", "--dirty=-SNAPSHOT"
}.standardOutput.asText.map { it.trim() }

def gitCommitProvider = providers.exec {
    commandLine "git", "--no-pager", "-C", projectDir, "rev-parse", "--short", "HEAD"
}.standardOutput.asText.map { it.trim() }

// Commit timestamp instead of Instant.now(): keeps generateBuildInfo up-to-date-able
// (Instant.now() invalidated the task on every single build, forcing a full recompile)
// and makes the jar reproducible.
def gitCommitTimeProvider = providers.exec {
    commandLine "git", "--no-pager", "-C", projectDir, "log", "-1", "--format=%cI"
}.standardOutput.asText.map { it.trim() }

def buildVersion = { boolean considerSnapshot ->
    Integer major = 0
    Integer minor = 0
    Integer patch = null
    Integer build = null
    String snapshot = ""

    String versionStr = gitDescribeProvider.get()

    def pattern = /(?<major>\d*)\.(?<minor>\d*)(\.(?<patch>\d*))?(-(?<build>\d*)-(?<commit>[a-zA-Z\d]*))?/
    def matcher = versionStr =~ pattern

    if (matcher.find()) {
        major = matcher.group('major') as Integer ?: 0
        minor = matcher.group('minor') as Integer ?: 0
        patch = matcher.group('patch') as Integer ?: null
        build = matcher.group('build') as Integer ?: null
    }

    if (considerSnapshot && (versionStr.endsWith('SNAPSHOT') || build != null)) {
        minor++
        if (patch != null) patch = 0
        snapshot = "-SNAPSHOT"
    }

    return "${major}.${minor}" +
            (patch != null ? ".${patch}" : "") +
            (build != null ? ".${build}" : "") +
            snapshot
}

// for publishing a release, call Gradle with Environment Variable RELEASE:
// RELEASE=true gradle JSQLFormatter:publish
def isRelease = !providers.environmentVariable("RELEASE").getOrElse("").isEmpty()
version = buildVersion(!isRelease)
group = 'com.manticore-projects.jsqlformatter'
description = 'JSQLFormatter'

// Captured once so no task action has to touch project state at execution time.
def stableVersion = buildVersion(false)
def isSnapshot = version.toString().endsWith("-SNAPSHOT")

// ═══════════════════════════════════════════════════════════════════════════════════════
// BuildInfo source generation
// ═══════════════════════════════════════════════════════════════════════════════════════

abstract class GenerateBuildInfo extends DefaultTask {

    @Input
    abstract Property<String> getModuleName()

    @Input
    abstract Property<String> getPackageName()

    @Input
    abstract Property<String> getGitVersion()

    @Input
    abstract Property<String> getGitCommit()

    @Input
    abstract Property<String> getBuildTime()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        def dir = new File(outputDirectory.get().asFile, packageName.get().replace('.', '/'))
        dir.mkdirs()

        new File(dir, "BuildInfo.java").text = """\
            |package ${packageName.get()};
            |
            |public final class BuildInfo {
            |  public static final String NAME = "${moduleName.get()}";
            |  public static final String VERSION = "${gitVersion.get()}";
            |  public static final String GIT_COMMIT = "${gitCommit.get()}";
            |  public static final String BUILD_TIME = "${buildTime.get()}";
            |
            |  private BuildInfo() {}
            |}
            """.stripMargin()
    }
}

def generateBuildInfo = tasks.register('generateBuildInfo', GenerateBuildInfo) {
    moduleName.set(project.name)
    packageName.set('com.manticore.jsqlformatter')
    gitVersion.set(gitDescribeProvider)
    gitCommit.set(gitCommitProvider.orElse('unknown'))
    buildTime.set(gitCommitTimeProvider.orElse('unknown'))
    outputDirectory.set(layout.buildDirectory.dir("generated/sources/buildinfo/java/main"))
}

// Registering the TaskProvider (not a bare File) is what wires the task dependency.
// The previous `srcDir(<File>)` + `mustRunAfter` combination declared NO dependency at
// all - mustRunAfter only orders tasks that are already both in the graph - so a clean
// build could reach compileJava without BuildInfo.java existing.
sourceSets {
    main {
        java {
            srcDir(generateBuildInfo)
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════════════════
// Java toolchain / compilation
// ═══════════════════════════════════════════════════════════════════════════════════════

java {
    withSourcesJar()

    // Compile and run with 17 (needed for XML-Doclet, since Doclet changed with Java 13),
    // emit Java 11 bytecode via `options.release` below. `sourceCompatibility` /
    // `targetCompatibility` are intentionally NOT set: `release` supersedes them and also
    // validates against the Java 11 API surface, which target/source never did.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

// Reproducible archives.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def createdBy = providers.systemProperty('user.name').orElse('unknown')

tasks.named('jar', Jar) {
    manifest {
        attributes(
                "Created-By": createdBy.get(),
                "Automatic-Module-Name": "com.manticore.jsqlformatter"
        )
    }

    bundle {
        properties.empty()
        bnd(
                "Created-By": createdBy.get(),
                "Bundle-SymbolicName": "com.manticore.jsqlformatter",
                "Import-Package": "*",
                "Export-Package": "com.manticore.jsqlformatter.*",
                "Automatic-Module-Name": "com.manticore.jsqlformatter"
        )
    }
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.addBooleanOption('html5', true)
    options.addBooleanOption("Xdoclint:none", true)
}

// ═══════════════════════════════════════════════════════════════════════════════════════
// XML Javadoc
// ═══════════════════════════════════════════════════════════════════════════════════════

def xmlDocFileName = isSnapshot ? "javadoc_snapshot.xml" : "javadoc_stable.xml"

def xmldoc = tasks.register('xmldoc', Javadoc) {
    source = sourceSets.main.allJava
    classpath = sourceSets.main.runtimeClasspath

    title = "API $version"
    destinationDir = reporting.file("xmlDoclet")
    options.docletpath = configurations.xmlDoclet.files as List
    options.doclet = "com.manticore.tools.xmldoclet.XmlDoclet"
    options.addStringOption("basePackage", "com.manticore.jsqlformatter")
    options.addStringOption("filename", xmlDocFileName)
}

// The legacy build called `copy { }` inline in the task *configuration* block, so it ran
// at configuration time - before the Javadoc had been generated - and copied whatever
// stale file happened to be on disk. A real Copy task fixes the ordering and the
// up-to-date checking.
def copyXmlDoc = tasks.register('copyXmlDoc', Copy) {
    from(xmldoc) {
        include xmlDocFileName
    }
    into layout.projectDirectory.dir("src/site/sphinx")
}

xmldoc.configure {
    finalizedBy(copyXmlDoc)
}

// ═══════════════════════════════════════════════════════════════════════════════════════
// Test
// ═══════════════════════════════════════════════════════════════════════════════════════

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    minHeapSize = "128m"
    maxHeapSize = "1G"

    // forkEvery = 1 gives every test class a pristine JVM, so JSQLFormatter's mutable
    // static formatting options cannot leak from one class into the next. That holds
    // regardless of how many forks run concurrently, so parallelism stays on.
    //
    // Dropping forkEvery is what exposed the leak: JUnit's *class* discovery order
    // follows filesystem enumeration and fork assignment follows availableProcessors(),
    // so order differs between a desktop and a CI runner -- "passes locally, fails on
    // GitHub". Remove once FormattingOptions is threaded through per call.
    forkEvery = 1
    maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))

    // Stable, machine-independent environment.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.timezone', 'UTC'

    // Opt-in randomised ordering for the nightly job:
    //   ./gradlew test -PrandomTestOrder
    if (project.hasProperty('randomTestOrder')) {
        systemProperty 'junit.jupiter.testclass.order.default',
                'org.junit.jupiter.api.ClassOrderer$Random'
    }

    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

// ═══════════════════════════════════════════════════════════════════════════════════════
// Quality / coverage
// ═══════════════════════════════════════════════════════════════════════════════════════

def generatedSourceExclude = '**/BuildInfo.java'

license {
    excludes(["**/*.txt", "**/*.conf", "**/*.sql", generatedSourceExclude])
    includes(["**/*.properties", "**/*.java", "**/*.xml"])

    ext.year = Year.now().value
    ext.name = 'Andreas Reichel'
    ext.email = 'andreas@manticore-projects.com'

    strictCheck = false
    ignoreFailures = true
}

coveralls {
    jacocoReportPath layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    violationRules {
        rule {
            limit {
                minimum = 0.69
            }
            excludes = []
        }
        rule {
            limit {
                counter = 'LINE'
                value = 'MISSEDCOUNT'
                maximum = 800
            }
            excludes = []
        }
    }
}

spotbugs {
    excludeFilter = file("config/spotbugs/spotBugsExcludeFilter.xml")
}

tasks.named('spotbugsMain') {
    reports {
        html {
            required = true
            // Gradle 9 removed Report.destination - outputLocation is the only setter left.
            outputLocation = layout.buildDirectory.file("reports/spotbugs/main/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}

// do not run over the test, although we should do that eventually
tasks.named('spotbugsTest') {
    enabled = false
}

pmd {
    consoleOutput = true
    sourceSets = [sourceSets.main]

    // Pin the analyzer. Gradle 9.6 defaults to PMD 7.24.0; leaving it implicit means a
    // Gradle upgrade can silently change which rules exist and break config/pmd/ruleset.xml.
    toolVersion = '7.24.0'

    // clear the ruleset in order to use configured rules only
    ruleSets = []

    ruleSetFiles = files("config/pmd/ruleset.xml")
}

tasks.named('pmdMain', Pmd) {
    // SourceTask patterns are relative to the source roots, so the old
    // "build/generated/*" pattern never matched anything.
    exclude generatedSourceExclude
}

checkstyle {
    sourceSets = [sourceSets.main, sourceSets.test]
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    exclude generatedSourceExclude
    reports {
        xml.required = false
        html.required = true
    }
}

spotless {
    // optional: limit format enforcement to just the files changed by this feature branch
    ratchetFrom 'origin/main'

    format 'misc', {
        // define the files to apply `misc` to
        target '*.rst', '*.md', '.gitignore'

        // define the steps to apply to those files
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
    java {
        targetExclude 'build/**'
        leadingTabsToSpaces(4)
        eclipse().configFile('config/formatter/eclipse-java-google-style.xml')
    }
}

// ═══════════════════════════════════════════════════════════════════════════════════════
// Publishing
// ═══════════════════════════════════════════════════════════════════════════════════════

mavenPublishing {

    // These two are what actually wire up Sonatype Central. Without
    // publishToMavenCentral() the plugin builds a publication with correct POM
    // metadata but has no deployment target, and Central rejects unsigned artifacts,
    // so signAllPublications() is equally non-optional.
    publishToMavenCentral()
    signAllPublications()

    coordinates(group, "jsqlformatter", version)

    pom {
        name = 'JSQLFormatter library'
        description = 'Format and pretty print SQL Statements'
        url = 'https://manticore-projects.com/JSQLFormatter/index.html'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'are'
                name = 'Andreas Reichel'
                email = 'andreas@manticore-projects.com'
            }
        }
        scm {
            connection = 'scm:git:https://github.com/manticore-projects/jsqlformatter.git'
            developerConnection = 'scm:git:ssh://git@github.com:manticore-projects/jsqlformatter.git'
            url = 'https://manticore-projects.com/JSQLFormatter/index.html'
        }
    }
}

// NOTE: signAllPublications() above makes the vanniktech plugin own signing, including
// the publish/sign task ordering. These two blocks were most likely scaffolding added
// while signAllPublications() was missing. Try deleting both once a signed release
// succeeds -- if signing still works, they were redundant. Left in place for now
// because removing them blind risks an unsigned release.
tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn(tasks.withType(Sign))
}

signing {
    required { !isSnapshot && gradle.taskGraph.hasTask("publish") }
}

// Resolve dynamic dependencies to concrete versions in POM
publishing {
    publications {
        configureEach {
            if (it instanceof MavenPublication) {
                // Suppress the warning about Maven-incompatible version notation
                it.suppressPomMetadataWarningsFor('runtimeElements')

                def runtimeClasspath = configurations.runtimeClasspath

                it.pom.withXml {
                    def resolved = runtimeClasspath.incoming.resolutionResult.allComponents
                            .collect { it.moduleVersion }
                            .findAll { it != null }

                    asNode().dependencies?.dependency?.each { depNode ->
                        def match = resolved.find {
                            it.group == depNode.groupId.text() && it.name == depNode.artifactId.text()
                        }
                        if (match != null) {
                            // Replace dynamic version (+, latest.release, ...) with resolved version
                            depNode.version[0].value = match.version
                        }
                    }
                }
            }
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════════════════
// Site: changelog, upload
// ═══════════════════════════════════════════════════════════════════════════════════════

tasks.register('gitChangelogTask', GitChangelogTask) {
    fromRepo.set(projectDir.toString())
    file.set(new File(projectDir, "src/site/sphinx/changelog.rst"))

    // switch off the formatter since the indentation matters for Mark-down
    // @formatter:off
    templateContent.set("""
************************
Changelog
************************


{{#tags}}
{{#ifMatches name "^Unreleased.*"}}
Latest Changes since |JSQLPARSER_VERSION|
{{/ifMatches}}
{{#ifMatches name "^(?!Unreleased).*"}}
Version {{name}}
{{/ifMatches}}
=============================================================

 {{#issues}}

  {{#commits}}
   {{#ifMatches messageTitle "^(?!Merge).*"}}
  * **{{{messageTitle}}}**
    
    {{authorName}}, {{commitDate}}
   {{/ifMatches}}
  {{/commits}}

 {{/issues}}
{{/tags}}
""")
    // @formatter:on
}

remotes {
    webServer {
        host = findProperty("${project.name}.host")
        user = findProperty("${project.name}.username")
        identity = new File("${System.properties['user.home']}/.ssh/id_rsa")
    }
}

ssh.settings {
    timeoutSec = 60000
}

tasks.register('upload') {
    dependsOn(tasks.named('jar'), tasks.named('gitChangelogTask'), xmldoc)

    // The hidetake ssh plugin runs its session from a task action, which is inherently
    // incompatible with the Configuration Cache. Declared rather than discovered.
    //
    // TODO(Gradle 10): `ssh.run { }` reaches into Project at execution time. That is a
    // deprecation warning in Gradle 9 and an error in Gradle 10, and the plugin offers no
    // lazy alternative. Replace with an `Exec` task shelling out to rsync/scp, or with a
    // custom task using an injected ExecOperations, before upgrading past 9.x.
    notCompatibleWithConfigurationCache("org.hidetake.ssh uses Project services at execution time")

    // Everything the action needs is captured here, at configuration time.
    def webServerHost = findProperty("${project.name}.host")
    def remoteDir = "download/${project.name}-${stableVersion}"
    def jarFiles = layout.buildDirectory.dir("libs").map { it.asFileTree.matching { include '*.jar' } }
    def moduleName = project.name

    doFirst {
        if (webServerHost == null) {
            println("""
                Property "${moduleName}.host" not found.
                Please define "${moduleName}.host" in the Gradle configuration (e.g. \$HOME/.gradle/gradle.properties).
                """.stripIndent()
            )
        }
    }
    doLast {
        ssh.run {
            session(remotes.webServer) {
                execute "mkdir -p ${remoteDir}"
                jarFiles.get().each { File f ->
                    put from: f, into: remoteDir
                }
            }
        }
    }
}
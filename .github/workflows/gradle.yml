# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Gradle CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege. Raise per job only where something actually needs to write.
permissions:
  contents: read

jobs:
  gradle_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Gradle Check
        run: ./gradlew check

  gradle_publish:
    needs: gradle_check
    runs-on: ubuntu-latest

    # Never publish from a pull request. Secrets are not available to pull_request runs from
    # forks at all, so without this guard a fork PR reaches ./gradlew publish with empty
    # credentials and fails with exactly the "Credentials required for this build" error.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Fail here, with a readable message, rather than 15 seconds later inside Gradle.
      - name: Verify publishing secrets are present
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        run: |
          missing=""
          [ -n "$USERNAME" ]    || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$PASSWORD" ]    || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$SIGNING_KEY" ] || missing="$missing OSSRH_GPG_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle maps ORG_GRADLE_PROJECT_<name> environment variables onto project properties, which
      # is what com.vanniktech.maven.publish reads. No gradle.properties file, no GPG keyring, no
      # GRADLE_USER_HOME juggling - and the secrets never touch the filesystem.
      #
      # OSSRH_GPG_SECRET_KEY is the ASCII armour, created with:
      #     gpg -a --export-secret-keys <key_id>
      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}